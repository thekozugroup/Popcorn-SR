# Layer over compose.worker.yaml or compose.single.yaml. Build locally.
# Requires Docker Compose 2.30+. SDK/driver paths are operator-provisioned.
services:
  worker:
    image: "${POPCORN_NGX_IMAGE:-popcorn-sr-ngx:dev}"
    build:
      context: .
      dockerfile: Dockerfile.ngx
    gpus: all
    # NGX loads signed feature code through temporary files. Replace the base
    # noexec/64-MiB mount, rather than merging two mounts at the same target.
    tmpfs: !override ["/tmp:rw,exec,nosuid,nodev,size=384m"]
    environment:
      POPCORN_NGX_LIBRARY: /opt/ngx/libpopcorn-dlss.so
      POPCORN_NGX_DLSSG_LIBRARY: /opt/ngx/libpopcorn-dlssg.so
      POPCORN_NGX_RUNTIME: /opt/ngx
      LD_LIBRARY_PATH: /opt/ngx-driver:/opt/ngx:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
    volumes:
      - type: bind
        source: "${POPCORN_NGX_BUNDLE:?Set the folder containing the native bridge and licensed DLSS runtime}"
        target: /opt/ngx
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${POPCORN_NGX_DRIVER:?Set the host NVIDIA libnvidia-ngx.so.1 file path}"
        target: /opt/ngx-driver/libnvidia-ngx.so.1
        read_only: true
        bind: {create_host_path: false}

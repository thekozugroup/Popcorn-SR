name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run python scripts/check-native-source.py --download-headers
      - run: uv run pytest -q
      - run: npm ci --ignore-scripts && npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t popcorn-sr:dev .
      - run: uv run python scripts/docker-smoke.py
      - run: docker build -f Dockerfile.ngx -t popcorn-sr-ngx:dev .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: evidence/

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "popcorn-sr"
version = "0.4.4"
description = "Pair your library with your processing power. Self-hosted video transcoding and enhancement."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "licenses/*.txt", "THIRD-PARTY-NOTICES.md"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "av==17.0.0",
    "numpy==2.3.3",
    "webauthn>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "av>=14,<18", "numpy==2.3.3", "opencv-python-headless==4.13.0.92"]
ngx = ["av==17.0.0", "numpy==2.3.3", "opencv-python-headless==4.13.0.92"]
ai = [
    "torch==2.13.0+cu130; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "av==17.0.0",
    "numpy==2.3.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
popcorn-sr = "popcorn_sr.__main__:main"

[tool.hatch.build]
exclude = ["popcorn_sr/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["popcorn_sr"]

[tool.hatch.build.targets.sdist.force-include]
"popcorn_sr/static" = "popcorn_sr/static"

[tool.hatch.build.targets.wheel.force-include]
"popcorn_sr/static" = "popcorn_sr/static"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

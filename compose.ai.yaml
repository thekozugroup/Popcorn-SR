# Layer over compose.worker.yaml (paired) or compose.single.yaml (same host).
services:
  worker:
    image: "${POPCORN_AI_IMAGE:-popcorn-sr-ai:dev}"
    build:
      context: .
      dockerfile: Dockerfile.ai
    gpus: all
    environment:
      POPCORN_ESRGAN_MODEL: /scratch/models/RealESRGAN_x4plus.pth
      XDG_CACHE_HOME: /scratch/cache
      TORCH_HOME: /scratch/cache/torch
      CUDA_CACHE_PATH: /scratch/cache/cuda
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    shm_size: 1gb
